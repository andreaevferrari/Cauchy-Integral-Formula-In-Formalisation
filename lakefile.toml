name = "JordanCurve"
defaultTargets = ["JordanCurve"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# `weak.` because these are Mathlib's options, and the audit executable
# imports Lean alone — a hard -D would make it fail to elaborate.
weak.linter.flexible = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

# Pinned to the toolchain: doc-gen4 tracks Lean's version exactly, and a
# mismatch fails at elaboration rather than at resolution.
[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.32.2"

[[lean_lib]]
name = "JordanCurve"

# The audit is a `lean_exe` with its own root so that it links against Lean
# alone and loads the library at runtime; a static import would pull in the
# whole Mathlib closure and blow past macOS's ARG_MAX at link time.
[[lean_exe]]
name = "jordan-audit"
root = "Util.Audit"
